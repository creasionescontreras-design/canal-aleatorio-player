<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}
#player {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div id="player"></div>

<script>
const params = new URLSearchParams(window.location.search);
const playlistId = params.get("list") || "";
const videoId = params.get("v") || "";
const shuffle = params.get("shuffle") === "1";

let player;

function notifyApp(message) {
  try {
    if (window.AppInventor &&
        typeof window.AppInventor.setWebViewString === "function") {
      window.AppInventor.setWebViewString(message);
    }
  } catch (e) {}
}

const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "100%",
    height: "100%",
    playerVars: {
      playsinline: 1,
      autoplay: 1,
      controls: 1,
      rel: 0
    },
    events: {
      onReady: function(event) {
        if (playlistId) {
          event.target.loadPlaylist({
            list: playlistId,
            listType: "playlist",
            index: 0
          });

          event.target.setLoop(false);
          if (shuffle) {
            event.target.setShuffle(true);
          }
        } else if (videoId) {
  event.target.loadVideoById(videoId);
} 
      },

      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          notifyApp("PLAYING");
        }

        if (event.data === YT.PlayerState.ENDED) {
          notifyApp("ENDED");
          
          const videos = player.getPlaylist();
          const index = player.getPlaylistIndex();

          if (videos && index === videos.length - 1) {
            notifyApp("PLAYLIST_FINISHED");
          }
        }
      },

      onAutoplayBlocked: function() {
        notifyApp("AUTOPLAY_BLOCKED");
      },

      onError: function(event) {
        notifyApp("PLAYER_ERROR:" + event.data);
      }
    }
  });
}
</script>
</body>
</html>
